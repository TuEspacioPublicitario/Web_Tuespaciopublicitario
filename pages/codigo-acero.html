<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código Acero | Venta de Hierro y Materiales</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body, html { height: 100%; width: 100%; position: relative; }

        /* Imagen de fondo a pantalla completa */
        .background { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover; z-index: -1; 
        }

        /* Contenedor general centrado */
        .page-container {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
        }

        /* Franja central oscura */
        .central-column {
            background-color: rgba(12, 12, 12, 0.92);
            width: 100%;
            max-width: 620px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            text-align: center;
            color: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            position: relative;
        }

        h1 { 
            font-size: 2.6rem; 
            color: #ffcc00; 
            text-transform: uppercase; 
            margin-bottom: 12px; 
            font-weight: 800;
            letter-spacing: 1px;
        }
